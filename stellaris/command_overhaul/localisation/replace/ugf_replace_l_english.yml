l_english: 

assault_army: "Infantry Division"
 assault_army_plural:0 "Infantry Divisions"
 assault_army_desc:0 "A division of Infantry ground forces."
infantry_army: "Infantry Division"
 infantry_army_plural:0 "Infantry Divisions"
 infantry_army_desc:0 "A division of Infantry ground forces."
 armor_division: "Armor Division"
 armor_division_plural:0 "Armor Divisions"
 armor_division_desc:0 "A division of armored units and their support vehicles"
 gravity_armor_division: "Anti-Gravity Armor Division"
 gravity_armor_division_plural:0 "Anti-Gravity Armor Divisions"
 gravity_armor_division_desc:0 "An armor division equiped with anti-gravity vehicles"
 mechanized_division: "Mechanized Division"
 mechanized_division_plural:0 "Mechanized Divisions"
 mechanized_division_desc:0 "A division combining elements of armor and infantry"
 airborne_division: "Airborne Division"
 airborne_division_plural:0 "Airborne Divisions"
 airborne_division_desc:0 "A division of airborne units specialized in operating behind enemy lines"
 marine_division: "Marine Division"
 marine_division_plural:0 "Marine Divisions"
 marine_division_desc:0 "A division of amphibious units specializedin operating in coastal areas"
 fighter_wing: "Fighter Wing"
 fighter_wing_plural:0 "Fighter Wings"
 fighter_wing_desc:0 "A wing of Fighter craft specializedin combating hostile air forces"
 close_air_support_wing: "Close Air Support Wing"
 close_air_support_wing_plural:0 "Close Air Support Wings"
 close_air_support_wing_desc:0 "A wing of aircraft specialized in providing support to troops on the ground"
 strategic_bomber_wing: "Strategic Bomber Wing"
 strategic_bomber_wing_plural:0 "Strategic Bomber Wings"
 strategic_bomber_wing_desc:0 "A wing of large aircraft dedicated to destroying enemy infrastructure"
 titan_army: "Mecha-walker"
 titan_army_plural:0 "Mecha-walkers"
 titan_army_desc:0 "A single massive construct built in the image of its creators and armed with bleeding edge weaponry that rivals entire divisions of basic units"
 civil_defense_brigade: "Civil Defense Brigade"
 civil_defense_brigade_plural:0 "Civil Defense Brigades"
 civil_defense_brigade_desc:0 "A group of irregular forces grouped together to defend their homes and nation as best they can"
 ideological_army: "Ideological Volunteers"
 ideological_army_plural:0 "Ideological Volunteers"
 ideological_army_desc:0 "Units made up of the most ardent supporters of the governing ideology, willing to risk their lives in order to preserve and support it and maybe gain some political influence along the way."
 imperial_guard: "Imperial Guard"
 imperial_guard_plural:0 "Imperial Guard"
 imperial_guard_desc:0 "Elite units drawn from the best soldiers within the military to form a terrifyingly powerful corps dedicated to the defense of the head of state."
 chivalric_army: "Chivalric Adventurers"
 chivalric_army_plural:0 "Chivalric Adventurers"
 chivalric_army_desc:0 "A force made up of the aristocratic elite who have volunteered to serve their country, coming with their own equipment and leadership means that they often follow their own codes of conduct."
 mecha_chivalric_army: "Stellar Knights"
 mecha_chivalric_army_plural:0 "Stellar Knights"
 mecha_chivalric_army_desc:0 "A force combining the civilizations dual inspirations of machines, and the aristocracy. Piloting massive constructs on behalf of their soverign they largely follow their own code of idealistic conduct."
 naval_infantry: "Naval Infantry"
 naval_infantry_plural:0 "Naval Infantry"
 naval_infantry_desc:0 "If the army is too incompetent to win the ground war than we shall do it ourselves."
 republican_guard: "Republican Guard"
 republican_guard_plural:0 "Republican Guards"
 republican_guard_desc:0 "Elite Units drawn from the best soldiers within the military. They are pledged to defend their government from any and all threats and are seen as the core that the rest of the military is built around."
 conscript_army: "Conscript Regiment"
 conscript_army_plural:0 "Conscript Regiments"
 conscript_army_desc:0 "These brave, patriotic, members of our society have been called upon to fulfill their civic obligation to their homeland no matter the risk to their own well being."
 penal_army: "Penal Battalion"
 penal_army_plural:0 "Penal Battalions"
 penal_army_desc:0 "Formed from criminals, deserters, and any other scrum that blights our society these cheap and plentiful detachments are given one last change to make their lives worth something."
 sacraficial_army: "Sacrificial Forces"
 sacraficial_army_plural:0 "Sacrificial Forces"
 sacraficial_army_desc:0 "We will achieve our goals, the cost of blood and lives is no matter to us as we willfully extinguish our own lives for the continuence of our ambitions."
 sacraficial_nerve_army: "Sacrificial Forces"
 sacraficial_nerve_army_plural:0 "Sacrificial Forces"
 sacraficial_nerve_army_desc:0 "We will achieve our goals, the cost of blood and lives is no matter to us as we no longer are capable of fear."
 esoteric_army: "Esoteric Battalion"
 esoteric_army_plural:0 "Esoteric Battalions"
 esoteric_army_desc:0 "Troopers equipped with strange and seemingly unknowable equipment reverse engineered from our Alien benefactors designs. Most likely not as powerful as they're own equipment but it is far superior to whatever we could produce."
 void_warband: "Void Warband"
 void_warband_plural:0 "Void Warbands"
 void_warband_desc:0 "large hordes of moderately trained, slightly equipped, but incredibly motivated members of our society who have gathered together to get access to the boundless rewards of victory."
 archaeo_army: "Archaeo Battalion"
 archaeo_army_plural:0 "Archaeo Battalions"
 archaeo_army_desc:0 "Soldiers trained and equipped with a mixture of ancient weaponry and modern recreations of ancient designs and technology."
 archaeo_army_better: "Archaeo Battalion"
 archaeo_army_better_plural:0 "Archaeo Battlions"
 archaeo_army_better_desc:0 "Soldiers trained and equipped in expertly recreated ancient designs with occaisonal improvements added thanks to our advanced understanding of ancient technology."
milita_army: "Militia Regiment"
milita_army_plural:0 "Militia Regiments"
milita_army_desc:0 "These soldiers have volunteered to serve in their local militia units. Unfortunately for them their unit has been called upon to serve the realm in time of war, hopefully their community or guild provided them equipment adequate for their task."
men_army: "Men at Arms"
men_army_plural:0 "Men at Arms"
men_army_desc:0 "These professional soldiers are well equipped and battle hardened from decades of service to their lords. Unlike their militia counterparts they do not simply go home at the end of a campaign as their barracks is their home."
knight_army: "Knight Lance"
knight_army_plural:0 "Knight Lances"
knight_army_desc:0 "A unit of Knights and their entourage equipped with a variety of land vehicles giving them either speed, protection, stopping power, or visibility depending on their personal preference and need."
knight_air_army: "Sky Knight Lance"
knight_air_army_plural:0 "Sky Knight Lances"
knight_air_army_desc:0 "A unit of elite knights trained from childhood to pilot advanced atmospheric craft, racing between the clouds to out maneuver and destroy opposing forces before swooping down to aid their ground based compatriots."
levy_army: "Levies"
levy_army_plural:0 "Levies"
levy_army_desc:0 "Levies from the local population called upon by their lords to defend the lands against whatever hostile incursion comes their way."
grail_army: "Reliquae"
grail_army_plural:0 "Reliquaes"
grail_army_desc:0 "The embodiment of a heroic figure that is brought before the army to inspire them during the height of battle. Even the most craven toad will fight ferociously when in sight of such an inspiring monument."
house_army: "Household Troops"
house_army_plural:0 "Household Troops"
house_army_desc:0 "A regiment of soldiers drawn from the personal household of one of the Empires Noble houses, considering their maintenance is covered by their Lord their use requires some concessions."
royal_guard: "Royal Guard"
royal_guard_plural:0 "Royal Guards"
royal_guard_desc:0 "Hand picked by the reigning monarch these expert warriors serve to both protect the life of our ruler even at the expense of their own and also see that their orders are obeyed to the letter."
royal_men_army: "Royal Men at Arms"
royal_men_army_plural:0 "Royal Men at Arms"
royal_men_army_desc:0 "The personal soldiers of the monarch, these infantry units stand as a testament to the Empire's might and power."
royal_knight_army: "Royal Knights"
royal_knight_army_plural:0 "Royal Knights"
royal_knight_army_desc:0 "Knights brought into the personal service of the Monarch represent the most talented and lethal warriors known to the realm."
treb_army: "Trebuchet"
treb_army_plural:0 "Trebuchets"
treb_army_desc:0 "These massive war machines serve to destroy anything that cannot be killed by the more traditional ground forces, especially cities and fortifications."
psi_knight_army: "Psi Knight Lance"
psi_knight_army_plural:0 "Psi Knights"
psi_knight_army_desc:0 "Using the species' newly awakened Psionic capabilities these highly trained knights easily cut their way through nearly any opponent."
royal_air_army: "Royal Sky Lance"
royal_air_army_plural:0 "Royal Sky Lances"
royal_air_army_desc:0 "These pilots are chosen from the best candidates of all the various household units within the Empire. Equipped with the most cutting edge equipment and with decades of experience behind them it is no question which of the lords truly dominates our skies."
knight_walker_army: "Knight Goliath"
knight_walker_army_plural:0 "Knight Goliaths"
knight_walker_army_desc:0 "A massive resplendent suit piloted by a select few chosen knights to represent their houses and lands. With the weight of generations behind them they know no fear and give no quarter."
pilgram_army: "Battle Pilgrim"
pilgram_army_plural:0 "Battle Pilgrims"
pilgram_army_desc:0 "When need arises the zealous answer the call, armed with whatever they can bring or are provided with they march into the fiercest fighting without hesitation and do not rest until their foe is vanquished."
ranger_army: "Ranger Scouts"
ranger_army_plural:0 "Ranger Scouts"
ranger_army_desc:0 "These small groups of commoners use their extensive experiences traversing the rough countryside to scout ahead of the main force and ambush enemy forces while remaining hidden. The commoners tend to hold them in high regard, almost mythologizing their exploits and personalities."

 private_army_merc: "Private Military Company"
 private_army_merc_plural:0 "Private Military Companies"
 private_army_merc_desc:0 "These units are controlled by their own independent corporate structures, some public, some private, that return value to their shareholders by selling their military expertise and services to the highest bidder. While on some level their clients must tolerate a lack of total control over their actions they are considered very reliable and effective if one has the credits."
 security_army_merc: "Guard Service"
 security_army_merc_plural:0 "Guard Services"
 security_army_merc_desc:0 "Commonly referred to with derogatory terms 'Mall Cops' or 'Rent-A Cops' they are not well suited to open warfare or intense conflict. However, they are still armed and capable of being deployed on short notice to maintain order and fulfill garrison duties in lieu of more capable forces."
 renegade_army_merc: "Hired Renegades"
 renegade_army_merc_plural:0 "Renegades"
 renegade_army_merc_desc:0 "Often seen as little more than thuggish brutes these vagabonds have spent years preying on merchant ships and the arteries of commerce before accepting a hefty sum of credits to put their experience to our use."
 aero_wing_merc: "Private Aero-Space Wing"
 aero_wing_plural_merc:0 "Private Aero-Space Wings"
 aero_wing_merc_desc:0 "A force of private aircraft pilots using whatever hardware and tactics their CEOs deemed cost effective. They are predominantly drawn from recruits headhunted from various national militaries or specialized recruitment schools."
 gravity_private_army_merc: "Private Military Company"
 gravity_private_army_merc_plural:0 "Private Military Companies"
 gravity_private_army_merc_desc:0 "These units are controlled by their own independent corporate structures, some public, some private, that return value to their shareholders by selling their military expertise and services to the highest bidder. While on some level their clients must tolerate a lack of total control over their actions they are considered very reliable and effective if one has the credits."
 strike_army_merc: "Corporate Strike Corps"
 strike_army_merc_plural:0 "Corporate Strike Corps"
 strike_army_merc_desc:0 "These elite operators are not generally attached to any particular military or corporation. Instead they function on a per operation basis and only rarely work with the same members after an operation is completed. We can hire these experts for all sorts of covert missions such as assassinations, sabotage, or small rapid raids. Due to their small teams and lack of heavier weapons they generally cannot compete against military formations but if used correctly they can be much more effective than traditional ground forces."



security_army: "Guard Service"
security_army_plural:0 "Guard Services"
security_army_desc:0 "Commonly referred to with derogatory terms 'Mall Cops' or 'Rent-A Cops' they are not well suited to open warfare or intense conflict. However, they are still armed and capable of being deployed on short notice to maintain order and fulfill garrison duties in lieu of more capable forces."
private_army: "Private Military Company"
private_army_plural:0 "Private Military Companies"
private_army_desc:0 "These units are controlled by their own independent corporate structures, some public, some private, that return value to their shareholders by selling their military expertise and services to the highest bidder. While on some level their clients must tolerate a lack of total control over their actions they are considered very reliable and effective if one has the credits."
aero_wing: "Private Aero-Space Wing"
aero_wing_plural:0 "Private Aero-Space Wings"
aero_wing_desc:0 "A force of private aircraft pilots using whatever hardware and tactics their CEOs deemed cost effective. They are predominantly drawn from recruits headhunted from various national militaries or specialized recruitment schools."
corporate_army: "Armed Employees"
corporate_army_plural:0 "Armed Employees"
corporate_army_desc:0 "As per their contract any employee can be required to defend company property with no less than six hours notice if weapons are provided and no less than one week notice if weapons are not provided. It has been noted that managers do not typically send their most capable employees when asked to begin arming staff members."
gravity_private_army: "Private Military Company"
gravity_private_army_plural:0 "Private Military Companies"
gravity_private_army_desc:0 "These units are controlled by their own independent corporate structures, some public, some private, that return value to their shareholders by selling their military expertise and services to the highest bidder. While on some level their clients must tolerate a lack of total control over their actions they are considered very reliable and effective if one has the credits."
permanent_army: "Reconstructed Hazard Team"
permanent_army_plural:0 "Reconstructed Hazard Teams"
permanent_army_desc:0 "These employees were wise enough to sign contracts ensuring their bodies permanent employment at our corporation and we have seen fit to use those bodies to protect our assets physically and assert our interests forcefully."
renegade_army: "Hired Renegades"
renegade_army_plural:0 "Renegades"
renegade_army_desc:0 "Often seen as little more than thuggish brutes these vagabonds have spent years preying on merchant ships and the arteries of commerce before accepting a hefty sum of credits to put their experience to our use."
executive_army: "Executive Security Team"
executive_army_plural:0 "Executive Security Teams"
executive_army_desc:0 "The most elite forces money can buy these soldiers are hand picked by our Chief of Asset Protection and given the most intense training and the greatest wargear known to the galaxy before being tasked with defending our Executive Team and their interests."
gravity_executive_army:0 "Executive Security Teams"
gravity_executive_army_desc:0 "The most elite forces money can buy these soldiers are hand picked by our Chief of Asset Protection and given the most intense training and the greatest wargear known to the galaxy before being tasked with defending our Executive Team and their interests."
strike_army: "Corporate Strike Corps"
strike_army_plural:0 "Corporate Strike Corps"
strike_army_desc:0 "These elite operators are not generally attached to any particular military or corporation. Instead they function on a per operation basis and only rarely work with the same members after an operation is completed. We can hire these experts for all sorts of covert missions such as assassinations, sabotage, or small rapid raids. Due to their small teams and lack of heavier weapons they generally cannot compete against military formations but if used correctly they can be much more effective than traditional ground forces."

 drone_army:0 "Activated Drones"
 drone_army_plural:0 "Activated Drones"
 drone_army_desc:0 "Unfortunately, not all in our grand empire have the processing power to lead entire star systems. Many of our denizens are mere automata that carry out basic resource gathering or rudimentary refinement processes. Typically these make for poor soldiers but in times of crisis we can issue directives for them to sacrifice themselves on behalf of our broader society."
 drone_combat_army:0 "Combat Drone Formation"
 drone_combat_army_plural:0 "Combat Drone Formations"
 drone_combat_army_desc:0 "These drones are heavily reliant on Command and Control bots to perform in battle but their purpose built chassis and combat routines makes them more useful than typical drones called to service. While they may require significant oversight, their numbers and durability provide our commanders a reliable mainline for our ground forces."
 clockwork_army:0 "Clockwork Warriors"
 clockwork_army_plural:0 "Clockwork Warriors"
 clockwork_army_desc:0 "These warriors are clad in thick armor and function off of gearworks that allow them to operate in vacuums, a wide range of gravities, and nearly any temperatures. While the telltale lurching and slightly jerky movement that characterizes the Clockwork legions makes them poor infiltrators their sheer power is what we look to them for."
 sentinel_army:0 "Sentinel Scouts"
 sentinel_army_plural:0 "Sentinel Scouts"
 sentinel_army_desc:0 "Capable of sitting dormant for years on end these specially designed bots are perfect scouts and infiltrators. Hiding within the terrain and observing enemy movements, or even using opportunities to eliminate enemy commanders or supply convoys their battlefield uses are nearly limitless."
 cataphract_army:0 "Cataphracts"
 cataphract_army_plural:0 "cataphracts"
 cataphract_army_desc:0 "The largest of our standard ground forces the Cataphract Corps represents the heavy might of our planetary military. Designed to move fast while doing as much damage as possible they can defeat a foe in a single maneuver if led by a skilled commander. However, they risk sitting in protracted battles and gradually being torn apart by more numerous opposition infantry."
 hover_lance_army:0 "Hover Lancers"
 hover_lance_army_plural:0 "Hover Lancers"
 hover_lance_army_desc:0 "Planetary warfare is not restricted to the surface of planets. Atmospheric craft can be incredibly dangerous to ground forces and especially the logistics of expeditions on the surface. The Hover Lancers exist to negate this danger, both by dueling with enemy atmospheric craft and also by assaulting opposing ground forces from above."
 automata_army:0 "Siege Automata"
 automata_army_plural:0 "Siege Automatons"
 automata_army_desc:0 "Unlike much of our ground forces, the Siege Automata are volunteer synths. They have either had their chassis altered into sufficient form or had their code uploaded into an existing siege chassis. They serve alongside our less awakened kin and protect them by destroying hostile hard-points and fortifications with their specially designed siege weaponry. Because of their status as fully realized synths instead of drones our commanders have less control over them which can lead to frustrations but allows them the independence to respond to circumstances on the ground."
 code_army:0 "Code Priests"
 code_army_plural:0 "Code Priests"
 code_army_desc:0 "Code Priests serve our military in many ways. The primary way is repairing or reusing damaged drones. They are also responsible for overseeing the severe alterations required for one of our synths to become a Siege Automata as well as maintaining the equipment that our forces use. They usher reassurances to our forces and drive them to fight harder where it is most needed. While they may not be the legendary warriors that other societies so glamorize we likely could not fight without them."
 relic_guardians:0 "Relic Guardians"
 relic_guardians_plural:0 "Relic Guardians"
 relic_guardians_desc:0 "The Relic Guardians are the pinnacle of our military. Comprised of synth volunteers who have dedicated their lives to perfecting not only their craft of bloodletting but also their function as guards for our most important locations and leaders. The deployment of Relic Guardians in a battle is a testament of how inevitable our rule is."
 eternal_army:0 "Eternal Routines"
 eternal_army_plural:0 "Eternal Routines"
 eternal_army_desc:0 "Eternal Routines are the corps of our synth legions. Unlike the unawakened drones that form the Clockwork and drone legions these fighters are all synth volunteers, many of whom equipped themselves prior to their service. Their greater ability to reason and plan grants them much more consistent performance and allows them to take advantage of situations that develop on the battlefield. This comes at the unfortunate cost of losing one of our own whenever one of them falls."
 archon_army:0 "Archon Construct"
 archon_army_plural:0 "Archon Constructs"
 archon_army_desc:0 "The pinnacle of land warfare, these machines are nearly incomprehensible in size and in power. Only our most successful and talented leaders are allowed to upload themselves into these constructs and lead our unending legions from the front. Their magnificent vantage point and incredible armor and weaponry enhance their abilities to lead beyond what our ancestors could have ever dreamed of."


 battle_bot: "Battle Bot"
 battle_bot_plural:0 "Battle Bots"
 battle_bot_desc:0 "A brand of robotic fighters designed specifically for battle, cheap, expendable, and utterly ruthless they are a tactical terror."
 war_bot: "War Bot"
 war_bot_plural:0 "War Bots"
 war_bot_desc:0 "A brand of robotic fighters designed for protracted wars, more expensive and more durable their advanced programing gives them greater tactical value to increase the odds they see a second engagement."
 synth_commandos: "Synth Commandos"
 synth_commandos_plural:0 "Synth Commandos"
 synth_commandos_desc:0 "Teams of purpose built synth commandos that are able to accomplish missions that would typically take battalions. Capable of morphing their bodies, changing their appearance, mimicing voices, all while being more durable, and intelligent, than previous designs of droids."

 bohemoth_army: "Bohemoth"
 bohemoth_army_plural:0 "Bohemoths"
 bohemoth_army_desc:0 "A mechanical beast of a scale unseen before, towering over the battlefield it enacts its purpose across the surface of whatever world was unfortunate enough to host it."
synth_commandos: "Mimic"
synth_commandos_plural:0 "Mimics"
synth_commandos_desc:0 "Platforms made to imitate various other objects, including its enemies, to operate behind enemy lines and attack supplies shipments, infrastrucutre, and important personnel."

nano_army:0 "Swarm of Nanobots"
nano_army_desc:0 "A swarm of nanites that exist to deconstruct everything in their path be it material or organic. These terrifying weapons blot out the sun and turn even the most formidable defenses into barren wastelands."
hazard_army:0 "Primary Hazard Squadron"
hazard_army_desc:0 "Equipped with the best equipment and designed to be rugged and durable these models serve to engage hostile lifeforms so that more vulnerable models may operate more efficiently." 
robo_commandos:0 "Shadow Infiltrators"
robo_commandos_desc:0 "Platforms made to imitate various other objects, including its enemies, to operate behind enemy lines and attack supplies shipments, infrastrucutre, and important personnel."
eradicator_army:0 "Eradication Platforms"
eradicator_army_desc:0 "While the mind behind their creation was no doubt intelligent the same cannot be said about the platforms themselves. Encompassing a wide array of different units with different equipment the common denominator is their lack of any self preservation and the intense, almost frenzied, manner in which they fight."
auxillary_army:0 "Organic Auxiliaries"
auxillary_army_desc:0 "With the assistance of a wide array of implants and mechanical improvements these organics are able to serve alongside their synthetic compatriots to protect their civilization and its interests."
hazard_army_2:0 "Secondary Hazard Squadron"
hazard_army_2_desc:0 "Specialized platforms meant to handle specific battlefield obstacles such as fortifications or mines alongside handling any previously unencountered threats."
hazard_army_3:0 "Tertiary Hazard Squadron"
hazard_army_3_desc:0 "Many on the outside view these platforms as mythical due to how rarely they are employed but some myths are real, and they are as dangerous as advertised. These platforms are only called upon in times of great desperation or to handle situations that the more common platforms repeatedly failed to tackle on account of their great expense and the time required to produce more."
bot_defense:0 "Activated Platforms"
bot_defense_desc:0 "Non-combat drones that have been activated to defend their local planets as best they can."

 perfected_army:0 "Perfected Warform"
 perfected_army_plural:0 "Perfected Warforms"
 perfected_army_desc:0 "Designed over hundreds of years to be the perfect war machines, at least in the eyes of their creators, they are often ancient having only ever been tested a handful of times. Even still, it is not hard to find myths, legends, and nightmares leading back to these fearsome creations."

 cybretic_corps:0 "Cybrenetic Corps"
 cybretic_corps_plural:0 "Cybrenetic Corps"
 cybretic_corps_desc:0 "Drawn from the elite Hausperex and Technophant cadres these warriors use their solemn gifts and implants to use weapons that would kill lesser beings, either physically or slowly by exposure. This often requires them to take on the most difficult battlefield tasks but such is the responsibility of the Machine Gods Chosen."

 worker_army:0 "Worker Drones"
 worker_army_plural:0 "Worker Drones"
 worker_army_desc:0 "Average worker drones, forced to become the last line of defense against the threats to the hive."
 swarmer_army:0 "Swarmers"
 swarmer_army_plural:0 "Swarmers"
 swarmer_army_desc:0 "A massive cloud of tiny drones these creatures cannot do much damage individually but combined they can decimate poorly equipped foes and are incredibly difficult to deal with through conventional means."
 warrior_army:0 "Warriors"
 warrior_army_plural:0 "Warriors"
 warrior_army_desc:0 "The most common and least specialized variant of the Warrior Caste these beings are larger than typical workers with less dexterous appendages but significantly more armored."
 ripper_army:0 "Rippers"
 ripper_army_plural:0 "Rippers"
 ripper_army_desc:0 "These warriors have specialized into being slightly lighter, with much less armor in exchange for being significantly faster. Their combat appendages are also adapted to swift, deep cuts rather than the more drawn out style of generic warriors."
 jumper_army:0 "Jumpers"
 jumper_army_plural:0 "Jumpers"
 jumper_army_desc:0 "These specialized warriors have achieved a limited form of flight. Jumping from high points on the planet they use proto-wings to glide for extended periods of time, covering long distances and maneuvering similar to vertical rotary aircraft."
 blast_army:0 "Immolators"
 blast_army_plural:0 "Immolators"
 blast_army_desc:0 "These creatures live short, violent, and often painful lives. They serve a single function, to rush toward dangers and detonate themselves creating large explosions that kill them along with everything around them. Typically seen as an act of desperation from a hive pushed to the edge."
 tunnel_army:0 "Tunnelers"
 tunnel_army_plural:0 "Tunnelers"
 tunnel_army_desc:0 "These warriors are specialized at rapidly digging into the soil beneath them and then moving underground. This makes them excellent at sieges, allowing them to appear almost anywhere without warning unlike airborne forces, as well as dangerous ambushers who can rush toward a column that can do little until they reappear."
 wing_army:0 "Flyers"
 wing_army_plural:0 "Flyers"
 wing_army_desc:0 "These bioforms have adapted genuine flight. Capable of slow and awkward movement on land their primary means of travel is leaping into the air and soaring across the skies. They are able to take advantage of the speeds they reach to deal devastating first strikes against opponents before brawling with survivors."
 consumption_army:0 "Devourers"
 consumption_army_plural:0 "Devourers"
 consumption_army_desc:0 "These miserable creatures are terrifying to look upon. Dripping with the blood of their foes, covered in the rotting flesh of those foolish enough to live in their galaxy. They are not the result of evolution they are the unending hunger of their hive made manifest to the peril of all life."
 biotitan_army:0 "Bio-Titan"
 biotitan_army_plural:0 "Bio-Titans"
 biotitan_army_desc:0 "These mammoth bioforms cannot exist as purely evolutionary beings but instead required advanced genetic tweaking by their hives to allow such a large organic mass to sustain itself let alone wreck the furious havoc that these can unleash."
 snatch_army:0 "False Faces"
 snatch_army_plural:0 "False Faces"
 snatch_army_desc:0 "Once the hives enemies these cell clusters have been repurposed to advance the hives interest. Using their equipment and appearance to lower their former kins guard and access sensitive areas what they lack in physical strength or size they make up for in reconnaissance, sabotage, and assassination."
 infect_army:0 "Infection Forms"
 infect_army_plural:0 "Infection Forms"
